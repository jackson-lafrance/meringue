name: Release gem

on:
  push:
    tags:
      - "v*"

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Publish to RubyGems
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: write
      id-token: write

    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Require a release commit from main
        run: |
          git fetch --no-tags origin main
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "Release tags must point to a commit already merged into main." >&2
            exit 1
          fi

      - name: Set up Ruby
        uses: ruby/setup-ruby@95ef2b042f9d7a56d8268cba8559e2842e2ad01b # master, 2026-08-22
        with:
          ruby-version: ruby
          bundler-cache: true

      - name: Match the tag to the gem version
        run: |
          version="$(bundle exec ruby -Ilib -rmeringue/version -e 'print Meringue::VERSION')"
          if [ "$GITHUB_REF_NAME" != "v$version" ]; then
            echo "Tag $GITHUB_REF_NAME does not match gem version $version." >&2
            exit 1
          fi
          echo "SOURCE_DATE_EPOCH=$(git show -s --format=%ct "$GITHUB_SHA")" >> "$GITHUB_ENV"

      - name: Validate the release and package
        run: bundle exec rake release:validate test package:verify

      - name: Publish with RubyGems trusted publishing
        uses: rubygems/release-gem@7f9650160c1a4e7989fdc9855807bdbd421d8b6b # v1

      - name: Create checksum
        run: sha256sum pkg/*.gem | sed 's#  pkg/#  #' > pkg/SHA256SUMS

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            pkg/*.gem pkg/SHA256SUMS \
            --generate-notes \
            --title "$GITHUB_REF_NAME" \
            --verify-tag
