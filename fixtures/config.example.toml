# Copy to ~/.meringue/config.toml and adjust for your machine.

# Written by first-run setup. Uncomment (or delete the section after setup has
# run) to control whether the setup flow opens on the next launch; /setup always
# reopens it by hand.
# [onboarding]
# completed_version = 1
# completed_at = "2026-08-06T14:02:11Z"
# outcome = "completed"   # or "skipped"

[settings]
schema_version = 1

[experiments]
# New installations are local-first. Enable this for built-in gh title/status
# lookups, delivery PR verification, markers, pickers, and opening actions.
github_support = false

[tui]
# Default yellow/white Meringue palette. Other options:
# rose-pine, tokyonight, gruvbox, catppuccin, kanagawa
# You can also run /theme <name>, or preview and save it from /config.
colorscheme = "meringue"
# animations = true

[tui.keybindings]
# Omitted actions keep defaults. Use /keybind in the TUI to see active bindings.
# agent_select_previous = ["k", "up", "left"]
# agent_select_next = ["j", "down", "right"]
# Focused workspace commands default to Ctrl-Space followed by one suffix.
# workspace_leader = ["ctrl-space"]
# workspace_switch_view = ["t"]
# workspace_cycle_filter = ["f"]
# workspace_open_agent_session = ["a"]   # legacy name workspace_open_pi_session still works
# workspace_open_editor = ["b"]
# workspace_open_pull_request = ["p"]
# workspace_close = ["q"]

[harness]
# provider applies to both head and worker agents unless overridden below.
provider = "pi"
# head_provider = "claude"
# worker_provider = "antigravity"

[harness.pi]
command = "pi"
session_dir = "~/.meringue/pi-sessions"
# Shared defaults for every future Pi head and worker. `/model` and `/thinking`
# keep this backward-compatible behavior; role-specific commands write the
# optional overrides below instead.
model = "anthropic/claude-opus-5"
thinking_level = "max"
# head_model = "openai/gpt-5.6-sol"
# worker_model = "anthropic/claude-opus-5"
# head_thinking_level = "low"
# worker_thinking_level = "max"
# Role arrays still own tools and other Pi flags; role model/thinking overrides,
# then the shared scalar fallback, are appended last if arrays contain
# --model/--thinking.
head_extra_args = ["--model", "anthropic/claude-opus-5", "--thinking", "max", "--tools", "read,bash,grep,find,ls", "--no-extensions", "--no-skills", "--no-prompt-templates", "--no-context-files", "--no-approve"]
worker_extra_args = ["--model", "anthropic/claude-opus-5", "--thinking", "max", "--tools", "read,bash,grep,find,ls,edit,write", "--no-extensions", "--no-skills", "--no-prompt-templates", "--no-context-files", "--no-approve"]

[commands]
# Full-command, case-sensitive globs for Pi worker bash calls. `*` matches any
# characters (including newlines), `?` matches one, and all other text is literal.
worker_blacklist = []

[conflicts]
# Dependent workers cancel if their predecessor fails; "run" starts them anyway.
predecessor_failure = "cancel"

[harness.claude]
command = "claude"
use_json_schema = true
head_extra_args = ["--effort", "high", "--tools", "Read,Glob,Grep,Bash", "--permission-mode", "plan", "--disable-slash-commands"]
worker_extra_args = ["--effort", "high", "--permission-mode", "acceptEdits"]

[harness.antigravity]
command = "agy"
head_extra_args = []
worker_extra_args = []

[terminal]
# alacritty_command = "/Applications/Alacritty.app/Contents/MacOS/alacritty"

[workspace]
# Independent durable worker reservations provision concurrently. Default: 2; maximum: 8.
# worker_provisioning_concurrency = 2
# Commands can be argv arrays (recommended) or safely split quoted strings.
# Defaults: $MERINGUE_SHELL/$SHELL or /bin/sh; and
# $MERINGUE_EDITOR/$VISUAL/$EDITOR or code.
# shell_command = ["/bin/zsh", "-l"]
# editor_command = ["code", "--reuse-window"]
editor_args = ["."]
# terminal_buffer_bytes = 4194304
