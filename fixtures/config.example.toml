# Copy to ~/.meringue/config.toml and adjust for your machine.

[tui]
# Default yellow/white Meringue palette. Other options:
# rose-pine, tokyonight, gruvbox, catppuccin, kanagawa
# You can also run /theme <name> in the TUI to save this setting.
colorscheme = "meringue"

[tui.keybindings]
# Omitted actions keep defaults. Use /keybind in the TUI to see active bindings.
# agent_select_previous = ["k", "up", "left"]
# agent_select_next = ["j", "down", "right"]
# Focused workspace commands default to Ctrl-Space followed by one suffix.
# workspace_leader = ["ctrl-space"]
# workspace_switch_view = ["t"]
# workspace_cycle_filter = ["f"]
# workspace_open_agent_session = ["a"]   # legacy name workspace_open_pi_session still works
# workspace_open_editor = ["b"]
# workspace_open_pull_request = ["p"]
# workspace_close = ["q"]

[harness]
# provider applies to both head and worker agents unless overridden below.
provider = "pi"
# head_provider = "claude"
# worker_provider = "antigravity"

[harness.pi]
command = "pi"
session_dir = "~/.meringue/pi-sessions"
# Defaults to GPT-5.6 Sol at Pi's xhigh thinking level. Override these arrays
# (the whole array replaces the default) to use a different model or level.
head_extra_args = ["--model", "openai/gpt-5.6-sol", "--thinking", "xhigh", "--tools", "read,bash,grep,find,ls", "--no-extensions", "--no-skills", "--no-prompt-templates", "--no-context-files", "--no-approve"]
worker_extra_args = ["--model", "openai/gpt-5.6-sol", "--thinking", "xhigh", "--tools", "read,bash,grep,find,ls,edit,write", "--no-extensions", "--no-skills", "--no-prompt-templates", "--no-context-files", "--no-approve"]

[harness.claude]
command = "claude"
use_json_schema = true
head_extra_args = ["--effort", "high", "--tools", "Read,Glob,Grep,Bash", "--permission-mode", "plan", "--disable-slash-commands"]
worker_extra_args = ["--effort", "high", "--permission-mode", "acceptEdits"]

[harness.antigravity]
command = "agy"
head_extra_args = []
worker_extra_args = []

[terminal]
# alacritty_command = "/Applications/Alacritty.app/Contents/MacOS/alacritty"

[workspace]
# Commands can be argv arrays (recommended) or safely split quoted strings.
# Defaults: $MERINGUE_SHELL/$SHELL or /bin/sh; and
# $MERINGUE_EDITOR/$VISUAL/$EDITOR or code.
# shell_command = ["/bin/zsh", "-l"]
# editor_command = ["code", "--reuse-window"]
editor_args = ["."]
# terminal_buffer_bytes = 4194304
